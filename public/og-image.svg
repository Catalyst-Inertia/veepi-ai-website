<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Dark Background -->
    <rect id="bg" width="1200" height="630" fill="#101010"/>
    
    <!-- Gradient for Orb -->
    <radialGradient id="orbGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0876B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C05EC4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <use href="#bg"/>

  <!-- Background Gradient Orb -->
  <circle cx="600" cy="150" r="400" fill="url(#orbGradient)" opacity="0.5"/>

  <!-- Content Container -->
  <g transform="translate(100, 250)">
    
    <!-- Headline -->
    <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" fill="#FBF2E9">
      AI Video Platform for Medical
    </text>
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" fill="#FBF2E9">
      &amp; Aesthetic Practices
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="normal" fill="#A0A0A0">
      Turn patient results into high-converting video content
    </text>
  </g>
</svg>